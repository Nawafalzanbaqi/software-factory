# =========================================================================
# One command spins up the WHOLE factory:
#   docker compose up --build
#
# Every service lives on the default compose network and talks to the
# others BY SERVICE NAME (postgres, redis, backend, platform) — no host
# IPs, no WSL/Windows localhost bridging. Host-published ports:
#   frontend   http://localhost:3000  client storefront (Next.js + Payload)
#   backend    http://localhost:8080  client product API (.NET 9)
#   dashboard  http://localhost:3001  factory dashboard (internal admin)
#   platform   http://localhost:5090  factory control-plane API (.NET 9)
#   postgres   localhost:5432         shared PostgreSQL (factory + factory_platform DBs)
#   redis      localhost:6379         cache for the backend
#
# Configuration: copy .env.example -> .env (compose reads .env automatically).
# =========================================================================
name: software-factory

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-factory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_prod}
      POSTGRES_DB: ${POSTGRES_DB:-factory}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-factory}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB:-factory};Username=${POSTGRES_USER:-factory};Password=${POSTGRES_PASSWORD:-change_me_in_prod}
      ConnectionStrings__Redis: redis:6379
      Cors__AllowedOrigins: ${Cors__AllowedOrigins:-http://localhost:3000}
      # Dashboard bearer signing key (pair of the frontend's BACKEND_JWT_KEY).
      # Blank + Development ⇒ dev fallback; REQUIRED (with Jwt__Issuer /
      # Jwt__Audience) when ASPNETCORE_ENVIRONMENT is not Development.
      Jwt__Key: ${Jwt__Key:-}
      Jwt__Issuer: ${Jwt__Issuer:-}
      Jwt__Audience: ${Jwt__Audience:-}
    ports:
      - "${API_HTTP_PORT:-8080}:8080"
    # options.json is read at startup to conditionally register modules
    volumes:
      - ./options.json:/app/options.json:ro

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Baked into the CLIENT bundle at build time: the URL the BROWSER
        # uses to reach the backend, i.e. the host-published port above.
        NEXT_PUBLIC_API_BASE_URL: http://localhost:${API_HTTP_PORT:-8080}
    restart: unless-stopped
    depends_on:
      - backend
      - postgres
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      NEXT_PUBLIC_API_BASE_URL: http://localhost:${API_HTTP_PORT:-8080}
      NEXT_PUBLIC_SITE_URL: http://localhost:${FRONTEND_PORT:-3000}
      DATABASE_URI: postgres://${POSTGRES_USER:-factory}:${POSTGRES_PASSWORD:-change_me_in_prod}@postgres:5432/${POSTGRES_DB:-factory}
      REDIS_URL: redis://redis:6379
      AUTH_SECRET: ${AUTH_SECRET:-change_me_generate_a_32_byte_secret}
      AUTH_TRUST_HOST: "true"
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:-change_me_generate_a_long_random_string}
      # Dashboard bearer signing key (audit fix #1): this image is a
      # PRODUCTION `next build` (NODE_ENV is inlined at build time — the
      # runtime NODE_ENV above does not relax it), so minting FAILS CLOSED
      # unless BACKEND_JWT_KEY (= backend Jwt__Key) is set in .env. Required
      # to use /dashboard against the compose stack.
      BACKEND_JWT_KEY: ${BACKEND_JWT_KEY:-}
      BACKEND_JWT_ISSUER: ${BACKEND_JWT_ISSUER:-}
      BACKEND_JWT_AUDIENCE: ${BACKEND_JWT_AUDIENCE:-}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    # options.json is read at build/startup to conditionally enable features
    volumes:
      - ./options.json:/app/options.json:ro

  platform:
    build:
      context: ./platform
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:5090
      # Dedicated database on the shared postgres service; EF applies the
      # platform migrations on startup (creating the database if missing).
      PLATFORM_DB_CONNECTION: Host=postgres;Port=5432;Database=${PLATFORM_POSTGRES_DB:-factory_platform};Username=${POSTGRES_USER:-factory};Password=${POSTGRES_PASSWORD:-change_me_in_prod}
      # SEED_DEMO=true seeds 1 demo client + 1 demo ecommerce project
      # (idempotent) so the dashboard isn't empty. Off by default.
      SEED_DEMO: ${SEED_DEMO:-false}
    ports:
      - "${PLATFORM_HTTP_PORT:-5090}:5090"
    # /health only responds once migrations (and the optional demo seed) are
    # done, so `service_healthy` below means "API up AND data ready".
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5090/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  dashboard:
    build:
      context: ./apps/factory-dashboard
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      platform:
        condition: service_healthy
    environment:
      # Server-side base URL of the control plane — the compose service name,
      # never a host IP (read at runtime by src/lib/platform-api.ts).
      PLATFORM_API_BASE_URL: http://platform:5090
      # No default on purpose: a repo-known session-signing secret would let
      # anyone forge an admin cookie. Unset ⇒ the dashboard errors on every
      # request (fails closed) until .env provides a real value.
      AUTH_SECRET: ${DASHBOARD_AUTH_SECRET:-}
      # Sign-in credentials for the single operator. The password has NO
      # default — leave it unset and sign-in fails closed; set it in .env.
      ADMIN_EMAIL: ${DASHBOARD_ADMIN_EMAIL:-admin@softwarefactory.local}
      ADMIN_PASSWORD: ${DASHBOARD_ADMIN_PASSWORD:-}
      # Shared secret for POST /api/webhooks/ci (X-Webhook-Secret header).
      CI_WEBHOOK_SECRET: ${DASHBOARD_CI_WEBHOOK_SECRET:-}
    ports:
      - "${DASHBOARD_PORT:-3001}:3000"

volumes:
  postgres-data:
  redis-data:
