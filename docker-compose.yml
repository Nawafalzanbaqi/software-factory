# =========================================================================
# One command spins up the full local environment:
#   docker compose up --build
# Services: postgres, redis, backend (.NET 9 API), frontend (Next.js 15)
# =========================================================================
name: software-factory

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-factory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_prod}
      POSTGRES_DB: ${POSTGRES_DB:-factory}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-factory}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB:-factory};Username=${POSTGRES_USER:-factory};Password=${POSTGRES_PASSWORD:-change_me_in_prod}
      ConnectionStrings__Redis: redis:6379
      Cors__AllowedOrigins: ${Cors__AllowedOrigins:-http://localhost:3000}
    ports:
      - "${API_HTTP_PORT:-5080}:8080"
    # options.json is read at startup to conditionally register modules
    volumes:
      - ./options.json:/app/options.json:ro

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
      - postgres
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      NEXT_PUBLIC_API_BASE_URL: http://localhost:${API_HTTP_PORT:-5080}
      NEXT_PUBLIC_SITE_URL: http://localhost:${FRONTEND_PORT:-3000}
      DATABASE_URI: postgres://${POSTGRES_USER:-factory}:${POSTGRES_PASSWORD:-change_me_in_prod}@postgres:5432/${POSTGRES_DB:-factory}
      REDIS_URL: redis://redis:6379
      AUTH_SECRET: ${AUTH_SECRET:-change_me_generate_a_32_byte_secret}
      AUTH_TRUST_HOST: "true"
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:-change_me_generate_a_long_random_string}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    # options.json is read at build/startup to conditionally enable features
    volumes:
      - ./options.json:/app/options.json:ro

volumes:
  postgres-data:
  redis-data:
