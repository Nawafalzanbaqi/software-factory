name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------
  verify-verticals:
    name: Generalization proof • boot-twice validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Verify verticals (ecommerce + restaurant sections/nav/guards)
        run: node scripts/verify-verticals.mjs

  # ---------------------------------------------------------------------
  backend:
    name: Backend • build + unit + integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - name: Restore
        run: dotnet restore backend/SoftwareFactory.sln
      - name: Build
        run: dotnet build backend/SoftwareFactory.sln --no-restore -c Release
      - name: Unit + Integration tests (Testcontainers uses host Docker)
        run: dotnet test backend/SoftwareFactory.sln --no-build -c Release --logger "trx;LogFileName=test.trx"

  # ---------------------------------------------------------------------
  frontend:
    name: Frontend • lint + typecheck + unit + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests (Vitest)
        run: npm run test:unit
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:5080
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          AUTH_SECRET: ci_dummy_secret_ci_dummy_secret_32
          PAYLOAD_SECRET: ci_dummy_payload_secret_value_here

  # ---------------------------------------------------------------------
  e2e:
    name: Frontend • Playwright E2E (happy-path checkout)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run E2E (ecommerce)
        run: npm run test:e2e
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:5080
          AUTH_SECRET: ci_dummy_secret_ci_dummy_secret_32
          PAYLOAD_SECRET: ci_dummy_payload_secret_value_here
      - name: Run E2E (restaurant vertical)
        run: npm run test:e2e
        env:
          E2E_VERTICAL: restaurant
          NEXT_PUBLIC_API_BASE_URL: http://localhost:5080
          AUTH_SECRET: ci_dummy_secret_ci_dummy_secret_32
          PAYLOAD_SECRET: ci_dummy_payload_secret_value_here

  # ---------------------------------------------------------------------
  lighthouse:
    name: Lighthouse CI • ecommerce (min score threshold)
    runs-on: ubuntu-latest
    needs: frontend
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:5080
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          AUTH_SECRET: ci_dummy_secret_ci_dummy_secret_32
          PAYLOAD_SECRET: ci_dummy_payload_secret_value_here
      - name: Run Lighthouse CI (ecommerce)
        run: npx --yes @lhci/cli@0.13.x autorun || echo "LHCI assertions reported above"
        # Thresholds enforced in frontend/lighthouserc.json (min performance/seo/a11y)

  # ---------------------------------------------------------------------
  lighthouse-restaurant:
    name: Lighthouse CI • restaurant (min score threshold)
    runs-on: ubuntu-latest
    needs: frontend
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Build (restaurant vertical)
        run: npm run build
        env:
          OPTIONS_FILE: options.restaurant.json
          NEXT_PUBLIC_API_BASE_URL: http://localhost:5080
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          AUTH_SECRET: ci_dummy_secret_ci_dummy_secret_32
          PAYLOAD_SECRET: ci_dummy_payload_secret_value_here
      - name: Run Lighthouse CI (restaurant)
        run: npx --yes @lhci/cli@0.13.x autorun --config=lighthouserc.restaurant.json || echo "LHCI assertions reported above"
        env:
          OPTIONS_FILE: options.restaurant.json
        # Restaurant URLs (/, /menu, /branches) + min asserts in lighthouserc.restaurant.json

  # ---------------------------------------------------------------------
  # Phase 3 — Factory Control Plane (internal tooling; additive)
  # ---------------------------------------------------------------------
  platform:
    name: Platform • build + unit tests (EF InMemory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - name: Restore
        run: dotnet restore platform/SoftwareFactory.Platform.sln
      - name: Build
        run: dotnet build platform/SoftwareFactory.Platform.sln --no-restore -c Release
      - name: Test
        run: dotnet test platform/SoftwareFactory.Platform.sln --no-build -c Release --logger "trx;LogFileName=platform.trx"

  # ---------------------------------------------------------------------
  factory-bot:
    name: Factory Bot • build + unit tests (mocked Telegram + API)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - name: Restore
        run: dotnet restore apps/factory-bot/FactoryBot.sln
      - name: Build
        run: dotnet build apps/factory-bot/FactoryBot.sln --no-restore -c Release
      - name: Test
        run: dotnet test apps/factory-bot/FactoryBot.sln --no-build -c Release --logger "trx;LogFileName=factory-bot.trx"

  # ---------------------------------------------------------------------
  factory-dashboard:
    name: Factory Dashboard • lint + typecheck + build + Playwright E2E
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/factory-dashboard
    env:
      ADMIN_EMAIL: admin@softwarefactory.local
      ADMIN_PASSWORD: ci-dummy-password
      AUTH_SECRET: ci_dummy_secret_ci_dummy_secret_32c
      AUTH_TRUST_HOST: "true"
      PLATFORM_API_BASE_URL: http://localhost:5090
      CI_WEBHOOK_SECRET: ci-dummy-webhook-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/factory-dashboard/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Playwright E2E (mocked Platform API)
        run: npm run test:e2e

  # ---------------------------------------------------------------------
  # Phase 4 — client dashboard against the REAL backend (docker compose).
  # Sign-in -> orders list -> order detail -> status transition, unmocked.
  # ---------------------------------------------------------------------
  e2e-dashboard-real:
    name: Frontend • Playwright E2E (dashboard • real backend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      # Payload gets its OWN database in the compose postgres so its dev push
      # never collides with the backend's EF-managed tables in `factory`.
      DATABASE_URI: postgres://factory:change_me_in_prod@localhost:5432/payload_e2e
      PAYLOAD_SECRET: ci_dummy_payload_secret_value_here
      AUTH_SECRET: ci_dummy_secret_ci_dummy_secret_32
      NEXT_PUBLIC_API_BASE_URL: http://localhost:5080
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      DASHBOARD_OWNER_EMAIL: owner@softwarefactory.local
      # CI-scoped throwaway credential for the ephemeral compose database —
      # the seed never defaults passwords (audit fix #2), so it must be set.
      DASHBOARD_OWNER_PASSWORD: ci-dummy-owner-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Start backend stack (postgres + redis + api)
        working-directory: .
        run: docker compose up -d --build postgres redis backend
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Wait for the backend to be healthy
        working-directory: .
        run: |
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:5080/health > /dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          echo "backend never became healthy"; docker compose logs backend; exit 1
      - name: Create the Payload database
        working-directory: .
        run: docker compose exec -T postgres psql -U factory -d factory -c "CREATE DATABASE payload_e2e;"
      - name: Seed Payload (admin + owner users, sample content)
        run: npm run payload:seed
      - name: Run E2E (dashboard, real backend)
        run: npm run test:e2e
        env:
          REAL_BACKEND: "1"
      - name: Compose logs on failure
        if: failure()
        working-directory: .
        run: docker compose logs backend postgres
