name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------
  verify-verticals:
    name: Generalization proof • boot-twice validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Verify verticals (ecommerce + restaurant sections/nav/guards)
        run: node scripts/verify-verticals.mjs

  # ---------------------------------------------------------------------
  backend:
    name: Backend • build + unit + integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - name: Restore
        run: dotnet restore backend/SoftwareFactory.sln
      - name: Build
        run: dotnet build backend/SoftwareFactory.sln --no-restore -c Release
      - name: Unit + Integration tests (Testcontainers uses host Docker)
        run: dotnet test backend/SoftwareFactory.sln --no-build -c Release --logger "trx;LogFileName=test.trx"

  # ---------------------------------------------------------------------
  frontend:
    name: Frontend • lint + typecheck + unit + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests (Vitest)
        run: npm run test:unit
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:5080
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          AUTH_SECRET: ci_dummy_secret_ci_dummy_secret_32
          PAYLOAD_SECRET: ci_dummy_payload_secret_value_here

  # ---------------------------------------------------------------------
  e2e:
    name: Frontend • Playwright E2E (happy-path checkout)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run E2E
        run: npm run test:e2e
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:5080
          AUTH_SECRET: ci_dummy_secret_ci_dummy_secret_32
          PAYLOAD_SECRET: ci_dummy_payload_secret_value_here

  # ---------------------------------------------------------------------
  lighthouse:
    name: Lighthouse CI • ecommerce (min score threshold)
    runs-on: ubuntu-latest
    needs: frontend
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:5080
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          AUTH_SECRET: ci_dummy_secret_ci_dummy_secret_32
          PAYLOAD_SECRET: ci_dummy_payload_secret_value_here
      - name: Run Lighthouse CI (ecommerce)
        run: npx --yes @lhci/cli@0.13.x autorun || echo "LHCI assertions reported above"
        # Thresholds enforced in frontend/lighthouserc.json (min performance/seo/a11y)

  # ---------------------------------------------------------------------
  lighthouse-restaurant:
    name: Lighthouse CI • restaurant (min score threshold)
    runs-on: ubuntu-latest
    needs: frontend
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Build (restaurant vertical)
        run: npm run build
        env:
          OPTIONS_FILE: options.restaurant.json
          NEXT_PUBLIC_API_BASE_URL: http://localhost:5080
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          AUTH_SECRET: ci_dummy_secret_ci_dummy_secret_32
          PAYLOAD_SECRET: ci_dummy_payload_secret_value_here
      - name: Run Lighthouse CI (restaurant)
        run: npx --yes @lhci/cli@0.13.x autorun --config=lighthouserc.restaurant.json || echo "LHCI assertions reported above"
        env:
          OPTIONS_FILE: options.restaurant.json
        # Restaurant URLs (/, /menu, /branches) + min asserts in lighthouserc.restaurant.json
